<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Live2D 看板娘 · 本地测试</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
         margin: 24px; background: #f5f5f7; color: #1d1d1f; line-height: 1.7; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lead { font-size: 13.5px; color: #6e6e73; margin: 0 0 16px; }
  #log { background: #1e1e1e; color: #d4d4d4; padding: 14px; border-radius: 10px;
         font-family: Consolas, Monaco, monospace; font-size: 12px; line-height: 1.75;
         white-space: pre-wrap; max-height: 62vh; overflow: auto; }
  .ok   { color: #4ec9b0; }
  .err  { color: #f48771; }
  .warn { color: #dcdcaa; }
  .info { color: #9cdcfe; }
  .dim  { color: #808080; }
  .hint { background: #e8f4ff; border-left: 4px solid #0071e3; padding: 10px 14px;
          border-radius: 6px; font-size: 13px; margin: 14px 0; color: #1d1d1f; }

  /* 看板娘：固定在右下角（和库里默认一致，顺便验证默认定位） */
  .waifu { position: fixed; bottom: 0; right: 0; }
</style>
</head>
<body>
<h1>Live2D 看板娘 · 本地测试</h1>
<p class="lead">本页引用 <code>assets/</code> 下的引擎与逻辑，用本地 <code>models.json</code> 驱动，完全不访问 fghrsh 的服务器。</p>

<div class="hint">
  看右下角 👉 鼠标移上去会出工具栏（8 个图标）；点看板娘本体可以试气泡框。
</div>

<div class="hint" style="background:#fff8e6;border-color:#ffb800;">
  <strong>拖拽：</strong>拖动时两个方向都能动，松手会吸附到最近的边缘并贴底。
  窗口缩放时看板娘会跟着边缘走，不会跑到屏幕外。
  <button id="dmToggle" style="padding:4px 10px;margin-left:8px;cursor:pointer;">禁用拖拽</button>
  <span id="dmState" style="margin-left:8px;color:#86868b;"></span>
</div>

<div id="log"></div>

<script>
  const L = (msg, cls) => {
    const el = document.getElementById('log');
    const d = document.createElement('div');
    d.className = cls || '';
    d.textContent = msg;
    el.appendChild(d);
  };
  window.__TEST = { done: false, errors: [], rendered: null };
  window.addEventListener('error', e => {
    window.__TEST.errors.push(String(e.message));
    L('✗ 页面错误: ' + e.message, 'err');
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/icon.css">
<link rel="stylesheet" href="assets/waifu.css">

<!-- ==================== 看板娘 ==================== -->
<div class="waifu">
  <div class="waifu-tips"></div>
  <canvas id="live2d" class="live2d" width="280" height="250"></canvas>
  <div class="waifu-tool">
    <span class="el-icon-house"          title="首页"></span>
    <span class="el-icon-chat-dot-round" title="一言"></span>
    <span class="el-icon-user"           title="换角色"></span>
    <span class="el-icon-magic-stick"    title="换皮肤"></span>
    <span class="el-icon-camera"         title="拍照"></span>
    <span class="el-icon-view"           title="悬停隐藏"></span>
    <span class="el-icon-discover"       title="关于"></span>
    <span class="el-icon-switch-button"  title="关闭"></span>
  </div>
</div>

<script>
(async function () {
  try {
    // ⚠️ 顺序很重要：
    //    ① live2d.js           先定义 loadlive2d（引擎入口）
    //    ② live2d-static-api.js 才能劫持到它
    //    ③ waifu-tips.js        最后加载控制逻辑
    L('① 加载 live2d.js（引擎，必须最先）...', 'info');
    await loadJS('assets/live2d.js');
    L('   ✓ loadlive2d = ' + typeof window.loadlive2d, 'ok');

    L('② 加载 live2d-static-api.js（静态模型 API）...', 'info');
    await loadJS('assets/live2d-static-api.js');
    L('   ✓ createStaticModelAPI = ' + typeof window.createStaticModelAPI, 'ok');

    L('③ 加载 models.json ...', 'info');
    const data = await (await fetch('../live2d-models/models.json')).json();
    L('   ✓ 模型 ' + data.models.length + ' 个，形态 ' + data.variantCount + ' 个', 'ok');

    L('④ 安装静态 API hook ...', 'info');
    const api = window.createStaticModelAPI({
      base: '../live2d-models/',
      data: data,
      onLog: m => L('   [api] ' + m, 'dim'),
    });
    const h = api.install();
    L('   ✓ hook: xhr=' + h.xhr + ' ajax=' + h.ajax + ' loadlive2d=' + h.loadlive2d,
      h.loadlive2d ? 'ok' : 'err');
    if (!h.loadlive2d) L('   ⚠ loadlive2d 未劫持（加载顺序不对？）', 'err');

    L('⑤ 加载 waifu-tips.js（控制逻辑）...', 'info');
    await loadJS('assets/waifu-tips.js');
    L('   ✓ initModel = ' + typeof window.initModel + '，loadModel = ' + typeof window.loadModel, 'ok');

    L('⑥ 启动看板娘 ...', 'info');
    live2d_settings['waifuDraggable'] = localStorage.getItem('test-drag') || 'axis-x';
    live2d_settings['modelId'] = 1;
    live2d_settings['modelTexturesId'] = 0;
    live2d_settings['modelStorage'] = true;   // 记住选的模型与皮肤（刷新后恢复）
    live2d_settings['waifuMinWidth'] = 'disable';
    live2d_settings['waifuEdgeSide'] = 'right:0';
    live2d_settings['waifuDraggable'] = 'axis-x';
    live2d_settings['modelAPI'] = '../live2d-models/api/';
    window.initModel('assets/waifu-tips.json');

    await sleep(3000);

    L('⑦ 渲染检测 ...', 'info');
    const canvas = document.getElementById('live2d');

    // Live2D 用 WebGL 渲染，且默认 preserveDrawingBuffer=false，
    // 合成后帧缓冲会被清空 —— 直接读像素读到 0 是正常的。
    // 可靠的判据是：引擎是否接管了画布 + 全局 Live2D 对象是否建立。
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    const hasEngine = typeof window.Live2D !== 'undefined';

    L('   画布上下文: ' + (gl ? 'WebGL 已接管' : (canvas.getContext('2d') ? '2D' : '无')), '');
    L('   window.Live2D 对象: ' + (hasEngine ? '存在' : '不存在'), hasEngine ? 'ok' : 'err');
    L('   画布尺寸: ' + canvas.width + 'x' + canvas.height, '');

    if (hasEngine) {
      L('   ✓ 引擎已接管画布并完成初始化（渲染成功）', 'ok');
      window.__TEST.rendered = true;
    } else {
      L('   ✗ 引擎未初始化，模型没渲染出来', 'err');
      window.__TEST.rendered = false;
    }

    L('⑧ 工具栏绑定检查 ...', 'info');
    const icons = ['el-icon-house','el-icon-chat-dot-round','el-icon-user',
                   'el-icon-magic-stick','el-icon-camera','el-icon-view',
                   'el-icon-discover','el-icon-switch-button'];
    let bound = 0;
    icons.forEach(c => {
      const el = document.querySelector('.waifu-tool .' + c);
      const ev = el && window.jQuery && jQuery._data(el, 'events');
      if (ev && (ev.click || ev.pointerdown)) bound++;
    });
    L('   8 个图标中已绑定的: ' + bound + ' / 8', bound === 8 ? 'ok' : 'err');

    L('⑨ 拖拽模块检查 ...', 'info');
    const wf = document.querySelector('.waifu');
    L('   拖拽已初始化: ' + (wf.__yyy404DragInited ? '是' : '否'),
      wf.__yyy404DragInited ? 'ok' : 'err');
    L('   当前定位 left = ' + (wf.style.left || '(未设置)'), '');

    L('⑩ 悬停隐藏检查 ...', 'info');
    L('   已初始化: ' + (wf.__yyy404HideInited ? '是' : '否'),
      wf.__yyy404HideInited ? 'ok' : 'err');
    L('   （点工具栏的眼睛图标 → 鼠标移到模型上会隐藏，移开恢复）', 'dim');
    L('   （工具栏全程保持可见，这样才能再点一次关掉）', 'dim');

    L('⑪ 气泡框测试 ...', 'info');
    window.showMessage('你好呀~ 这是改造后的气泡框 ✨', 6000, true);
    L('   ✓ 已弹出（看右下角，注意小三角箭头）', 'ok');

    L('', '');
    L('============ 完成 ============', 'ok');
    window.__TEST.done = true;
  } catch (e) {
    L('✗ 异常: ' + e.message, 'err');
    L(e.stack, 'dim');
    window.__TEST.errors.push(String(e.message));
    window.__TEST.done = true;
  }
})();

function loadJS(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = false;
    s.onload = res;
    s.onerror = () => rej(new Error('加载失败: ' + src));
    document.head.appendChild(s);
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* 拖拽启用/禁用切换。改了之后刷新页面生效。 */
(function () {
  var box = document.getElementById('dmState');
  var btn = document.getElementById('dmToggle');
  if (!box || !btn) return;

  function current() { return localStorage.getItem('test-drag') || 'axis-x'; }
  function render() {
    var on = current() !== 'disable';
    box.textContent = on ? '（当前：启用）' : '（当前：禁用）';
    btn.textContent = on ? '禁用拖拽' : '启用拖拽';
  }
  render();
  btn.onclick = function () {
    localStorage.setItem('test-drag', current() === 'disable' ? 'axis-x' : 'disable');
    render();
    box.textContent += '  请刷新页面生效';
    box.style.color = '#ff9500';
  };
})();
</script>
</body>
</html>
